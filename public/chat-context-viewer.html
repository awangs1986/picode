<!doctype html>
<html lang="en-US">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <title data-i18n="chatContext.windowTitle">Chat context</title>
    <link rel="stylesheet" href="./style-theme.css" />
    <link rel="stylesheet" href="./chat-context-viewer.css" />
  </head>
  <body>
    <header class="context-header">
      <div class="context-heading">
        <div class="context-eyebrow">
          <span id="context-source">Picode</span>
          <span class="context-readonly" data-i18n="chatContext.readOnly"
            >Read-only local preview</span
          >
        </div>
        <h1 id="context-title" data-i18n="chatContext.loading">Loading conversation context...</h1>
        <div class="context-meta" id="context-meta"></div>
      </div>
    </header>

    <main class="context-main">
      <div id="context-messages" class="context-messages" aria-live="polite"></div>
      <div id="context-empty" class="context-empty" hidden></div>
      <div class="context-load-zone">
        <button id="context-load-more" type="button" data-i18n="chatContext.loadMore">
          Load more
        </button>
        <div id="context-status" class="context-status" role="status"></div>
      </div>
    </main>

    <script type="module" src="./chat-context-viewer-entry.js"></script>
  </body>
</html>
